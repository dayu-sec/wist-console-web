<!-- WistIngest（数据接收服务）：一条数据（圆点）落进接收漏斗，漏斗收口朝下 —— 强调“收进来”，
     不做成下载箭头，也不做出站方向。与 WistCenter 的三格蜂巢、WarpGateway 的单格立方体
     同一条家族线：20×20 圆角徽章 + 白色线稿，只换几何与渐变。
     配色从家族共用的紫罗兰 #8b5cf6 出发，经靛蓝 #6366f1 走到翡翠绿 #10b981：
     中心 = 紫罗兰→紫，网关 = 紫罗兰→青，接收服务 = 紫罗兰→翡翠，并排 16px 也分得开。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="WistIngest">
  <defs>
    <linearGradient id="ingest-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.55" stop-color="#6366f1" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="20" height="20" rx="5" fill="url(#ingest-badge)" />
  <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 接收漏斗：宽口进、窄口出 -->
    <path d="M4 7.4h12l-4.4 4.9v2.9h-3.2v-2.9Z" />
  </g>
  <!-- 正在被接收的一条数据 -->
  <circle cx="10" cy="2.9" r="1" fill="#ffffff" />
</svg>
