server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查专用，不打后端。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # BFF：浏览器只跟本容器说话。
    #
    # 身份（VPN/堡垒机 + mTLS）由**入口**终结，注入到请求头里；
    # 本容器不持有证据服务的客户端证书，也不直接连证据服务。
    location /api {
        proxy_pass http://console:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 资产拓扑：同源反代 atlas-web。
    #
    # 前提：atlas-web 必须以 `base: '/atlas/'` 构建，否则它的 `/assets/*` 会打到本域名根，
    # 页面白屏。深链（聚焦某台主机）走 `/atlas/#/host/<id>`，不做跨域 iframe。
    location /atlas/ {
        proxy_pass http://atlas-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退。图标与入口 HTML 不缓存（换版本后要能立刻拿到新 bundle）。
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
