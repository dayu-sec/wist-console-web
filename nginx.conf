server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器重建后 IP 会变。`proxy_pass http://console:8080` 这种写法只在**启动时**解析一次，
    # 上游一重建，这里就会拿着旧 IP 回 404/502（症状：页面能开、所有 /api 挂掉）。
    # 用变量 + resolver 让 nginx 按 TTL 重新解析（Docker 内嵌 DNS：127.0.0.11）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 容器健康检查专用，不打后端。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # BFF：浏览器只跟本容器说话。
    #
    # 身份（VPN/堡垒机 + mTLS）由**入口**终结，注入到请求头里；
    # 本容器不持有证据服务的客户端证书，也不直接连证据服务。
    location /api {
        set $console_upstream console:8080;
        proxy_pass http://$console_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # 资产拓扑：静态资源仍由 atlas-web 托管（iframe 的入口与 bundle 不带数据）。
    #
    # 前提：atlas-web 必须以相对资源路径构建（`base: './'`），否则它的 `/assets/*` 会打到本域名根，
    # 页面白屏。深链（聚焦某台主机）走 `/atlas/#/host/<id>`，不做跨域 iframe。
    # 变量形式的 proxy_pass 不会自动去掉 `/atlas` 前缀，所以用 rewrite 显式剥。
    # 注意：`break` 会终止 rewrite 阶段，**必须先把 set 写在前**，否则变量未初始化 → 500。
    location /atlas/ {
        set $atlas_web_upstream atlas-web:80;
        rewrite ^/atlas/(.*)$ /$1 break;
        proxy_pass http://$atlas_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 资产**数据**面不从 nginx 直连 atlas，而是绕回 BFF：
    #   /atlas/api/hosts → console `/api/atlas/hosts` → atlas `/hosts`
    # 这样令牌校验只有一道门（BFF 的 require_operator），不会出现
    # 「界面要令牌、但 /atlas/api 裸奔」的半吊子状态。
    # 注意：前缀匹配里 `/atlas/api/` 比 `/atlas/` 更长，所以这条优先。
    location /atlas/api/ {
        set $console_api_upstream console:8080;
        rewrite ^/atlas/api/(.*)$ /api/atlas/$1 break;
        proxy_pass http://$console_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 身份头：`ingress` 模式用；`cred` 模式靠浏览器带 `Authorization`。
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退。图标与入口 HTML 不缓存（换版本后要能立刻拿到新 bundle）。
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
